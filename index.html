<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>泰語羅馬拼音 500 大師學習旗艦屋</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // --- 修正後的語音播放函式 (改用 Google 線上雲端 TTS) ---
        const playThaiSpeech = (text) => {
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=th&client=tw-ob&q=${encodeURIComponent(text)}`;
            const audio = new Audio(url);
            audio.play().catch(e => console.error("播放失敗:", e));
        };

        const RAW_VOCAB_DB = [
            [6, "kluai", "กล้วย", "香蕉"],
            [15, "ka-fae", "กาแฟ", "咖啡"],
            [18, "kin", "กิน", "吃"],
            [23, "kluea", "เกลือ", "鹽"],
            [29, "kai", "ไก่", "雞肉"],
            [31, "kha-nom-pang", "ขนมปัง", "麵包"],
            [36, "khong-wan", "ของหวาน", "甜點"],
            [58, "khai", "ไข่", "雞蛋"],
            [71, "khem", "เค็ม", "鹹的"],
            [72, "khrueang-duem", "เครื่องดื่ม", "飲料"],
            [98, "chon", "ช้อน", "勺子"],
            [102, "cha", "ชา", "茶"]
        ];

        function App() {
            return (
                <div className="p-4 max-w-lg mx-auto">
                    <h1 className="text-xl font-bold mb-4 text-center">泰語 500 大師學習旗艦屋</h1>
                    <div className="grid gap-3">
                        {RAW_VOCAB_DB.map((item) => (
                            <div key={item[0]} className="p-4 bg-white shadow-sm rounded-xl border border-gray-100 flex justify-between items-center">
                                <div>
                                    <p className="font-bold text-lg text-violet-600">{item[1]}</p>
                                    <p className="text-sm text-gray-500">{item[2]} · {item[3]}</p>
                                </div>
                                <button 
                                    onClick={() => playThaiSpeech(item[2])}
                                    className="p-3 bg-violet-500 hover:bg-violet-600 text-white rounded-full transition-all active:scale-95"
                                >
                                    <i data-lucide="volume-2" className="w-5 h-5"></i>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
