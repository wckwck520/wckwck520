            const unlockAudio = useCallback(() => {
                if (!audioUnlocked && 'speechSynthesis' in window) {
                    const silentUtterance = new SpeechSynthesisUtterance('');

                    window.speechSynthesis.speak(silentUtterance);
                    setAudioUnlocked(true);

            // 強制載入並監聽語音包 (重要修復：解決 Chrome 語音包非同步載入問題)
            useEffect(() => {

                    const loadVoices = () => {
                        window.speechSynthesis.getVoices();
                    };
                    loadVoices();
                    window.speechSynthesis.onvoiceschanged = loadVoices;

            const playThaiSpeech = useCallback((thaiText) => {

                if ('speechSynthesis' in window) {

                        const utterance = new SpeechSynthesisUtterance(thaiText);
                        
                        // [關鍵修復] 解決 Chrome Desktop 會自動回收 (Garbage Collect) 語音實例導致無聲的 Bug
                        window._speechUtteranceRef = utterance;

                        utterance.lang = 'th-TH'; // 設定語言代碼為泰語
                        utterance.rate = 0.82;
                        
                        // 強制精確匹配泰語語音包 (解決 Chrome 有時無法自動識別 th-TH 的問題，抓取 Google ไทย)
                        const voices = window.speechSynthesis.getVoices();
                        const thaiVoice = voices.find(v => 
                            v.lang.toLowerCase().includes('th') || 
                            v.name.includes('ไทย') || 
                            v.name.toLowerCase().includes('thai')

                            window._speechUtteranceRef = null;
                        };

            // Accordion and AI States
            const [showBreakdown, setShowBreakdown] = useState(false);
            const [aiExplanation, setAiExplanation] = useState("");
            const [loadingAi, setLoadingAi] = useState(false);
            const [aiError, setAiError] = useState("");

            const totalQuestions = 10;

            const startNewGame = () => {
                setScore(0);
                setQuestionCount(0);
                setStreak(0);
                generateQuestion();
            };

            const generateQuestion = () => {
                const correctWord = VOCAB_DATA[Math.floor(Math.random() * VOCAB_DATA.length)];
                
                let distractors = [];
                while (distractors.length < 3) {
                    const candidate = VOCAB_DATA[Math.floor(Math.random() * VOCAB_DATA.length)];
                    if (candidate.id !== correctWord.id && !distractors.some(d => d.id === candidate.id)) {
                        distractors.push(candidate);
                    }
                }

                const shuffledOptions = [correctWord, ...distractors].sort(() => Math.random() - 0.5);

                setCurrentQuestion(correctWord);
                setOptions(shuffledOptions);
                setSelectedAnswer(null);
                setIsCorrect(null);
                setAiExplanation("");
                setAiError("");
                setShowBreakdown(false); 
                setGameState('playing');
                setQuestionCount(prev => prev + 1);

                // 在延遲前，瀏覽器必須已解除限制。我們在App中利用了點擊強制解除了
                setTimeout(() => {
                    playThaiSpeech(correctWord.thaiExample);
                }, 300);
            };

            const fetchAiBreakdown = async (sentence, translation) => {
                setLoadingAi(true);
                setAiExplanation("");
                setAiError("");
                const apiKey = ""; 

                const systemPrompt = "你是一位專業的泰語學習導師。請將給定的泰語羅馬拼音句子進行精確的「逐字/逐詞」對照翻譯與文法結構拆解。注意：絕對不要包含任何泰文文字（如泰文字母），只能使用羅馬拼音與中文！請排版成簡潔美觀的對照清單或標記，讓使用者能一目了然看清該句子中每個拼音單詞對應的中文含義。";
                const userQuery = `請為以下句子進行逐字拼音與中文釋義拆解：\n句子拼音：${sentence}\n整句翻譯：${translation}`;
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));
                
                for (let i = 0; i < 5; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error('API request failed');
                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            setAiExplanation(text);
                            setLoadingAi(false);
                            return;
                        }
                    } catch (error) {
                        if (i === 4) {
                            setAiError("暫時無法連線獲取 AI 深度解析，請查看本地詞典匹配結果。");
                            setLoadingAi(false);
                        }
                        await delay(Math.pow(2, i) * 1000);
                    }
                }
            };

            const handleAnswer = (option) => {
                if (selectedAnswer !== null) return;

                setSelectedAnswer(option);
                const correct = option.id === currentQuestion.id;
                setIsCorrect(correct);
                if (correct) {
                    setScore(prev => prev + 1);
                    setStreak(prev => prev + 1);
                } else {
                    setStreak(0);
                }
                setGameState('feedback');

                fetchAiBreakdown(currentQuestion.example, currentQuestion.exampleMeaning);
            };

            const handleNext = () => {
                if (questionCount >= totalQuestions) {
                    setGameState('finished');
                } else {
                    generateQuestion();
                }
            };

            const getLocalMatches = (sentence) => {
                if (!sentence) return [];
                const normalized = sentence.toLowerCase().replace(/[.,?!]/g, "");
                const matches = [];
                
                const sortedVocab = [...VOCAB_DATA].sort((a, b) => b.word.length - a.word.length);
                let remaining = normalized;

                for (const item of sortedVocab) {
                    const itemWord = item.word.toLowerCase();
                    const regex = new RegExp(`\\b${itemWord}\\b|\\b${itemWord}-|-${itemWord}\\b`, 'i');
                    if (regex.test(normalized) && remaining.includes(itemWord)) {
                        matches.push(item);
                        remaining = remaining.replace(itemWord, " ".repeat(itemWord.length));
                    }
                }

                return matches.sort((a, b) => normalized.indexOf(a.word.toLowerCase()) - normalized.indexOf(b.word.toLowerCase()));
            };

            const renderMarkdown = (text) => {
                if (!text) return null;
                const lines = text.split('\n');
                return lines.map((line, idx) => {
                    let cleaned = line.trim();
                    if (!cleaned) return <div key={idx} className="h-2"></div>;
                    
                    const isBullet = cleaned.startsWith('*') || cleaned.startsWith('-') || /^\d+\./.test(cleaned);
                    if (isBullet) {
                        cleaned = cleaned.replace(/^[\*\-\d\.]+\s*/, '');
                    }
                    
                    const parts = cleaned.split('**');
                    const renderedParts = parts.map((part, pIdx) => {
                        if (pIdx % 2 === 1) {
                            return <strong key={pIdx} className="text-violet-600 dark:text-violet-400 font-extrabold">{part}</strong>;
                        }
                        return part;
                    });

                    return (
                        <div key={idx} className={`text-xs md:text-sm leading-relaxed text-slate-700 dark:text-slate-300 py-1 ${isBullet ? 'pl-4 relative before:content-["•"] before:absolute before:left-0 before:text-violet-500 font-medium' : ''}`}>
                            {renderedParts}
                        </div>
                    );
                });
            };

            useEffect(() => {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, [gameState, options, aiExplanation, loadingAi, showBreakdown]);

            return (
                <div className="max-w-2xl mx-auto animate-fade-in space-y-4">
                    {/* Progress Card */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl border border-slate-100 dark:border-slate-700/50 transition-all">
                        <div className="flex justify-between items-center mb-3">
                            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">聽力闖關賽</span>
                            <div className="flex items-center space-x-2">
                                <span className="bg-amber-100 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 px-2.5 py-0.5 rounded-full text-xs font-bold flex items-center space-x-1">
                                    <i data-lucide="zap" className="w-3 h-3 text-amber-500 fill-amber-500"></i>
                                    <span>連勝 {streak}</span>
                                </span>
                                <span className="bg-violet-100 dark:bg-violet-950/50 text-violet-600 dark:text-violet-400 px-2.5 py-0.5 rounded-full text-xs font-bold">
                                    積分 {score}/{questionCount}
                                </span>
                            </div>
                        </div>

                        {gameState !== 'ready' && gameState !== 'finished' && (
                            <div className="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                <div 
                                    className="bg-gradient-to-r from-violet-500 to-indigo-600 h-full transition-all duration-300"
                                    style={{ width: `${(questionCount / totalQuestions) * 100}%` }}
                                ></div>
                            </div>
                        )}
                    </div>

                    {/* Ready State */}
                    {gameState === 'ready' && (
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 md:p-8 shadow-xl text-center border border-slate-100 dark:border-slate-700/50 transition-all">
                            <div className="w-16 h-16 md:w-20 md:h-20 mx-auto bg-violet-100 dark:bg-violet-900/40 rounded-full flex items-center justify-center mb-4 md:mb-6">
                                <i data-lucide="headphones" className="w-8 h-8 md:w-10 md:h-10 text-violet-500"></i>
                            </div>
                            <h2 className="text-xl md:text-2xl font-bold mb-2 md:mb-3">準備開始聽力測驗？</h2>
                            <p className="text-slate-500 dark:text-slate-400 mb-6 max-w-md mx-auto text-xs md:text-sm leading-relaxed">
                                系統將語音朗讀一句**泰語例句**，請您專心聆聽並選出對應的羅馬拼音及整句中文翻譯。答題後可自主展開每個單字的詳細解析！
                            </p>
                            <button
                                onClick={startNewGame}
                                className="w-full sm:w-auto bg-gradient-to-r from-violet-500 to-indigo-600 text-white font-semibold py-3.5 px-8 rounded-2xl shadow-lg hover:shadow-violet-500/30 transition hover:-translate-y-0.5"
                            >
                                立即啟動全量挑戰
                            </button>
                        </div>
                    )}

                    {/* Playing & Feedback State */}
                    {(gameState === 'playing' || gameState === 'feedback') && currentQuestion && (
                        <div className="space-y-4">
                            {/* Listening Player Card - Made slightly more compact on mobile */}
                            <div className="bg-white dark:bg-slate-800 rounded-3xl p-5 md:p-6 shadow-xl text-center border border-slate-100 dark:border-slate-700/50 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-violet-500 to-indigo-600"></div>
                                
                                <div className="flex flex-col items-center justify-center space-y-2">
                                    <button
                                        onClick={() => playThaiSpeech(currentQuestion.thaiExample)}
                                        className="w-16 h-16 md:w-20 md:h-20 bg-violet-500 hover:bg-violet-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-violet-500/20 transition hover:scale-105 active:scale-95 focus:outline-none group"
                                        title="播放語音"
                                    >
                                        <i data-lucide="play" className="w-8 h-8 fill-current translate-x-0.5 transition-transform group-hover:scale-110"></i>
                                    </button>
                                    <p className="text-xs text-slate-400 dark:text-slate-500 font-medium">點擊播放泰語音頻</p>
                                </div>

                                {gameState === 'feedback' && (
                                    <div className="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700/50 animate-fade-in text-center">
                                        <div className="inline-flex items-center justify-center p-1 rounded-full mb-1">
                                            {isCorrect ? (
                                                <span className="text-emerald-500 font-bold flex items-center space-x-1 text-sm md:text-base">
                                                    <i data-lucide="check-circle-2" className="w-4.5 h-4.5"></i>
                                                    <span>答對了！非常優秀</span>
                                                </span>
                                            ) : (
                                                <span className="text-rose-500 font-bold flex items-center space-x-1 text-sm md:text-base">
                                                    <i data-lucide="x-circle" className="w-4.5 h-4.5"></i>
                                                    <span>答錯了，請對照正確答案</span>
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Options List - Placed highly accessible for mobile and responsive padding */}
                            <div className="grid grid-cols-1 gap-2.5">
                                {options.map((option, index) => {
                                    let btnStyle = "bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700/50 border border-slate-100 dark:border-slate-700/50 text-slate-800 dark:text-slate-200";
                                    
                                    if (gameState === 'feedback') {
                                        if (option.id === currentQuestion.id) {
                                            btnStyle = "bg-emerald-50 dark:bg-emerald-950/20 border-2 border-emerald-500 dark:border-emerald-600 text-emerald-800 dark:text-emerald-100";
                                        } else if (selectedAnswer && selectedAnswer.id === option.id) {
                                            btnStyle = "bg-rose-50 dark:bg-rose-950/20 border-2 border-rose-500 dark:border-rose-600 text-rose-800 dark:text-rose-100 opacity-80";
                                        } else {
                                            btnStyle = "bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700/50 text-slate-400 dark:text-slate-600 opacity-50";
                                        }
                                    }

                                    return (
                                        <button
                                            key={option.id}
                                            onClick={() => handleAnswer(option)}
                                            disabled={gameState === 'feedback'}
                                            className={`p-3.5 md:p-5 rounded-2xl text-left transition flex justify-between items-center shadow-sm ${btnStyle}`}
                                        >
                                            <div className="flex-1 pr-2">
                                                <div className="flex items-start space-x-2">
                                                    <span className="w-5 h-5 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 rounded-md text-[10px] font-bold flex items-center justify-center shrink-0 mt-0.5">
                                                        {String.fromCharCode(65 + index)}
                                                    </span>
                                                    <div>
                                                        <span className="text-sm md:text-base font-bold tracking-tight block">
                                                            {option.example}
                                                        </span>
                                                        <span className="text-xs md:text-sm text-slate-500 dark:text-slate-400 mt-0.5 block font-medium">
                                                            翻譯: {option.exampleMeaning}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                            {gameState === 'feedback' && option.id === currentQuestion.id && (
                                                <i data-lucide="check" className="w-4 h-4 md:w-5 md:h-5 text-emerald-500 shrink-0"></i>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Next Question Control Button */}
                            {gameState === 'feedback' && (
                                <button
                                    onClick={handleNext}
                                    className="w-full bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-md transition flex items-center justify-center space-x-2"
                                >
                                    <span>{questionCount >= totalQuestions ? "查看結算結果" : "下一題"}</span>
                                    <i data-lucide="arrow-right" className="w-4 h-4"></i>
                                </button>
                            )}

                            {/* COLLAPSIBLE DETAIL ACCORDION */}
                            {gameState === 'feedback' && (
                                <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-150 dark:border-slate-700/50 shadow-md overflow-hidden transition-all duration-300">
                                    <button
                                        onClick={() => setShowBreakdown(!showBreakdown)}
                                        className="w-full p-4 flex justify-between items-center text-left font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors"
                                    >
                                        <span className="flex items-center space-x-2 text-xs md:text-sm uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                            <i data-lucide="book-open" className="w-4 h-4 text-violet-500"></i>
                                            <span>點擊展開：句子逐字與 AI 導師詳解</span>
                                        </span>
                                        <i data-lucide={showBreakdown ? "chevron-up" : "chevron-down"} className="w-4 h-4 text-slate-400"></i>
                                    </button>

                                    {showBreakdown && (
                                        <div className="p-4 pt-1 border-t border-slate-100 dark:border-slate-700/50 space-y-4 animate-fade-in">
                                            {/* Local Sub-Matches List */}
                                            <div>
                                                <div className="flex items-center justify-between mb-2">
                                                    <h5 className="text-[10px] uppercase font-extrabold text-slate-400 tracking-wider">句子單字匹配對照</h5>
                                                    <button
                                                        onClick={() => playThaiSpeech(currentQuestion.thaiExample)}
                                                        className="text-[10px] bg-violet-100 hover:bg-violet-200 dark:bg-violet-950 text-violet-600 dark:text-violet-300 px-2 py-0.5 rounded transition flex items-center space-x-1"
                                                    >
                                                        <i data-lucide="volume-2" className="w-3 h-3"></i>
                                                        <span>聽整句</span>
                                                    </button>
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                    {getLocalMatches(currentQuestion.example).map((match) => (
                                                        <div key={match.id} className="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-900/60 rounded-xl border border-slate-100 dark:border-slate-800">
                                                            <div>
                                                                <div className="flex items-center space-x-1.5">
                                                                    <span className="text-[9px] bg-slate-200 dark:bg-slate-700 text-slate-500 px-1 py-0.2 rounded font-mono">#{match.id}</span>
                                                                    <span className="font-bold text-slate-800 dark:text-slate-200 text-xs">{match.word}</span>
                                                                </div>
                                                                <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 font-medium">釋義: {match.meaning}</p>
                                                            </div>
                                                            <button
                                                                onClick={() => playThaiSpeech(match.thai)}
                                                                className="p-1 rounded bg-white dark:bg-slate-800 text-violet-500 hover:bg-violet-50 transition"
                                                                title="聽單字讀音"
                                                            >
                                                                <i data-lucide="volume-2" className="w-3 h-3"></i>
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* AI Explanation Text */}
                                            <div className="pt-3 border-t border-slate-100 dark:border-slate-700/80">
                                                <div className="flex items-center space-x-1 mb-2">
                                                    <i data-lucide="sparkles" className="w-3.5 h-3.5 text-amber-500"></i>
                                                    <span className="text-[10px] font-extrabold uppercase text-slate-400">AI 導師智能深度剖析</span>
                                                </div>

                                                {loadingAi ? (
                                                    <div className="flex items-center space-x-2 text-xs text-slate-400 py-2">
                                                        <div className="w-3 h-3 border-2 border-violet-500 border-t-transparent rounded-full animate-spin"></div>
                                                        <span>AI 正在全力解析中...</span>
                                                    </div>
                                                ) : aiError ? (
                                                    <p className="text-xs text-rose-500 font-medium py-1">{aiError}</p>
                                                ) : (
                                                    <div className="bg-slate-50/50 dark:bg-slate-900/40 p-3 rounded-xl border border-slate-100 dark:border-slate-800 max-h-48 overflow-y-auto">
                                                        {renderMarkdown(aiExplanation)}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Finished State */}
                    {gameState === 'finished' && (
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 md:p-8 shadow-xl text-center border border-slate-100 dark:border-slate-700/50 transition-all">
                            <div className="w-16 h-16 mx-auto bg-emerald-100 dark:bg-emerald-900/40 rounded-full flex items-center justify-center mb-4">
                                <i data-lucide="trophy" className="w-8 h-8 text-emerald-500"></i>
                            </div>
                            <h2 className="text-2xl font-extrabold mb-1.5 bg-gradient-to-r from-emerald-500 to-teal-500 bg-clip-text text-transparent">完成全量關卡！</h2>
                            <p className="text-slate-500 dark:text-slate-400 text-xs md:text-sm mb-6">您的泰語聽力極佳，順利征服 500 字挑戰！</p>
                            
                            <div className="bg-slate-50 dark:bg-slate-900/60 rounded-2xl p-4 max-w-sm mx-auto mb-6 grid grid-cols-2 gap-4">
                                <div className="text-center">
                                    <p className="text-[10px] text-slate-400 mb-0.5">答對題數</p>
                                    <p className="text-xl font-extrabold text-violet-500">{score} / {totalQuestions}</p>
                                </div>
                                <div className="text-center">
                                    <p className="text-[10px] text-slate-400 mb-0.5">正確率</p>
                                    <p className="text-xl font-extrabold text-emerald-500">{(score/totalQuestions) * 100}%</p>
                                </div>
                            </div>

                            <button
                                onClick={startNewGame}
                                className="w-full bg-gradient-to-r from-violet-500 to-indigo-600 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition"
                            >
                                再挑戰一次
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        /* =========================================================================
           2. MATCHING GAME COMPONENT
           ========================================================================= */
        function MatchingGame({ playThaiSpeech }) {
            const [cards, setCards] = useState([]);
            const [selectedCards, setSelectedCards] = useState([]); 
            const [matchedIds, setMatchedIds] = useState([]); 
            const [moves, setMoves] = useState(0);
            const [showSuccess, setShowSuccess] = useState(false);

            const startNewRound = () => {
                const selectedPool = [];
                const availableIndices = Array.from({ length: VOCAB_DATA.length }, (_, i) => i);
                
                for (let i = 0; i < 4; i++) {
                    const randomIndex = Math.floor(Math.random() * availableIndices.length);
                    const chosenWord = VOCAB_DATA[availableIndices[randomIndex]];
                    selectedPool.push(chosenWord);
                    availableIndices.splice(randomIndex, 1);
                }

                const wordCards = selectedPool.map(item => ({
                    id: item.id,
                    type: 'word',
                    display: item.word,
                    thai: item.thai
                }));

                const meaningCards = selectedPool.map(item => ({
                    id: item.id,
                    type: 'meaning',
                    display: item.meaning,
                    thai: item.thai
                }));

                const shuffledCards = [...wordCards, ...meaningCards].sort(() => Math.random() - 0.5);

                setCards(shuffledCards);
                setSelectedCards([]);
                setMatchedIds([]);
                setMoves(0);
                setShowSuccess(false);
            };

            const handleCardClick = (index) => {
                if (
                    matchedIds.includes(cards[index].id) ||
                    selectedCards.includes(index) ||
                    selectedCards.length >= 2
                ) {
                    return;
                }

                playThaiSpeech(cards[index].thai);

                const newSelection = [...selectedCards, index];
                setSelectedCards(newSelection);

                if (newSelection.length === 2) {
                    setMoves(prev => prev + 1);
                    const card1 = cards[newSelection[0]];
                    const card2 = cards[newSelection[1]];

                    if (card1.id === card2.id && card1.type !== card2.type) {
                        setTimeout(() => {
                            setMatchedIds(prev => {
                                const updated = [...prev, card1.id];
                                if (updated.length === 4) {
                                    setShowSuccess(true);
                                }
                                return updated;
                            });
                            setSelectedCards([]);
                        }, 500);
                    } else {
                        setTimeout(() => {
                            setSelectedCards([]);
                        }, 1000);
                    }
                }
            };

            useEffect(() => {
                startNewRound();
            }, []);

            useEffect(() => {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, [showSuccess]);

            return (
                <div className="max-w-2xl mx-auto space-y-4">
                    {/* Header bar */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl border border-slate-100 dark:border-slate-700/50 transition-all flex justify-between items-center">
                        <div>
                            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">配對樂翻天</span>
                            <h2 className="text-base md:text-lg font-bold">配對中文與羅馬拼音</h2>
                        </div>
                        <div className="flex items-center space-x-3">
                            <span className="bg-violet-50 dark:bg-violet-950 text-violet-600 dark:text-violet-400 px-3.5 py-1 rounded-full text-xs font-bold">
                                步數：{moves}
                            </span>
                            <button
                                onClick={startNewRound}
                                className="bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 p-2 rounded-xl transition"
                                title="重配新局"
                            >
                                <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    {/* Cards Grid */}
                    {!showSuccess ? (
                        <div className="grid grid-cols-2 gap-3.5 animate-fade-in">
                            {cards.map((card, index) => {
                                const isSelected = selectedCards.includes(index);
                                const isMatched = matchedIds.includes(card.id);

                                let cardClass = "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:scale-[1.02] shadow-sm";
                                if (isSelected) {
                                    cardClass = "bg-violet-50 dark:bg-violet-950/50 border-2 border-violet-500 dark:border-violet-600 shadow-md scale-98";
                                } else if (isMatched) {
                                    cardClass = "bg-emerald-50 dark:bg-emerald-950/20 border border-emerald-300 dark:border-emerald-800 text-emerald-800 dark:text-emerald-400 scale-95 opacity-50 cursor-default";
                                }

                                return (
                                    <button
                                        key={index}
                                        onClick={() => handleCardClick(index)}
                                        disabled={isMatched}
                                        className={`h-24 md:h-28 rounded-2xl border text-center font-bold transition-all duration-300 flex flex-col items-center justify-center p-3 relative ${cardClass}`}
                                    >
                                        <span className="text-sm md:text-lg tracking-tight select-none">{card.display}</span>
                                        <span className="absolute bottom-1.5 right-2 text-[8px] md:text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500">
                                            {card.type === 'word' ? 'Pinyin' : 'meaning'}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-xl text-center border border-slate-100 dark:border-slate-700/50 transition-all animate-fade-in">
                            <div className="w-16 h-16 mx-auto bg-emerald-100 dark:bg-emerald-900/40 rounded-full flex items-center justify-center mb-4">
                                <i data-lucide="sparkles" className="w-8 h-8 text-emerald-500"></i>
                            </div>
                            <h3 className="text-xl font-extrabold text-slate-800 dark:text-white mb-2">成功配對！</h3>
                            <p className="text-xs md:text-sm text-slate-500 dark:text-slate-400 mb-6">你在共 {moves} 步內完成了本次配對挑戰。</p>
                            
                            <button
                                onClick={startNewRound}
                                className="bg-gradient-to-r from-violet-500 to-indigo-600 text-white font-semibold py-3 px-6 rounded-2xl shadow-lg"
                            >
                                開啟下一局
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        /* =========================================================================
           3. VOCABULARY LIBRARY COMPONENT
           ========================================================================= */
        function VocabularyLibrary({ playThaiSpeech }) {
            const [selectedCatId, setSelectedCatId] = useState("all");
            const [searchQuery, setSearchQuery] = useState("");
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 12;

            const categoryCounts = useMemo(() => {
                const counts = { all: VOCAB_DATA.length };
                CATEGORIES.forEach(c => {
                    if (c.id !== "all") {
                        counts[c.id] = VOCAB_DATA.filter(item => item.categoryId === c.id).length;
                    }
                });
                return counts;
            }, []);

            const filteredVocab = useMemo(() => {
                let list = VOCAB_DATA;
                
                if (selectedCatId !== "all") {
                    list = list.filter(item => item.categoryId === selectedCatId);
                }

                const query = searchQuery.trim().toLowerCase();
                if (query) {
                    list = list.filter(item => 
                        item.word.toLowerCase().includes(query) ||
                        item.meaning.toLowerCase().includes(query) ||
                        item.example.toLowerCase().includes(query) ||
                        item.exampleMeaning.toLowerCase().includes(query) ||
                        item.id.toString() === query
                    );
                }

                return list;
            }, [selectedCatId, searchQuery]);

            const totalPages = Math.ceil(filteredVocab.length / itemsPerPage);
            const paginatedVocab = useMemo(() => {
                const startIndex = (currentPage - 1) * itemsPerPage;
                return filteredVocab.slice(startIndex, startIndex + itemsPerPage);
            }, [filteredVocab, currentPage]);

            useEffect(() => {
                setCurrentPage(1);
            }, [selectedCatId, searchQuery]);

            useEffect(() => {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, [paginatedVocab, currentPage, selectedCatId]);

            return (
                <div className="space-y-4 animate-fade-in">
                    {/* Search & Header bar */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl border border-slate-100 dark:border-slate-700/50 transition-all flex flex-col md:flex-row md:items-center justify-between gap-3">
                        <div>
                            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">羅馬拼音總字庫</span>
                            <h2 className="text-base md:text-xl font-bold">情境分類單字庫 (共 {filteredVocab.length} 個結果)</h2>
                        </div>
                        
                        {/* Search Input */}
                        <div className="relative flex-1 md:max-w-md">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="search" className="w-4 h-4"></i>
                            </div>
                            <input
                                type="text"
                                placeholder="搜尋拼音、含義或編號 (例: 500, kra-dat)..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full pl-9 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-violet-500 text-xs md:text-sm transition"
                            />
                        </div>
                    </div>

                    {/* HORIZONTAL CATEGORY SCROLL PANEL */}
                    <div className="overflow-x-auto pb-2 flex space-x-2 scrollbar-none snap-x snap-mandatory">
                        {CATEGORIES.map((cat) => {
                            const isSelected = selectedCatId === cat.id;
                            const count = categoryCounts[cat.id] || 0;
                            return (
                                <button
                                    key={cat.id}
                                    onClick={() => setSelectedCatId(cat.id)}
                                    className={`px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shrink-0 shadow-sm border snap-center ${
                                        isSelected 
                                            ? 'bg-violet-600 text-white border-violet-600 shadow-violet-500/20' 
                                            : 'bg-white hover:bg-slate-50 dark:bg-slate-800 dark:hover:bg-slate-700 border-slate-100 dark:border-slate-700/80 text-slate-600 dark:text-slate-350'
                                    }`}
                                >
                                    <span>{cat.name}</span>
                                    <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${
                                        isSelected 
                                            ? 'bg-white/20 text-white' 
                                            : 'bg-slate-100 dark:bg-slate-900 text-slate-500 dark:text-slate-400'
                                    }`}>
                                        {count}
                                    </span>
                                </button>
                            );
                        })}
                    </div>

                    {/* Vocab Grid */}
                    {paginatedVocab.length > 0 ? (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 animate-fade-in">
                            {paginatedVocab.map((item) => (
                                <div 
                                    key={item.id}
                                    className="bg-white dark:bg-slate-800 rounded-2xl md:rounded-3xl p-4 md:p-5 shadow-md hover:shadow-lg border border-slate-100 dark:border-slate-700/50 transition-all duration-300 flex flex-col justify-between group relative overflow-hidden"
                                >
                                    <div className="absolute top-0 right-0 h-1 w-12 bg-violet-400/80"></div>
                                    
                                    <div>
                                        {/* Word info */}
                                        <div className="flex justify-between items-start mb-2.5">
                                            <div className="flex items-center space-x-2">
                                                <span className="px-2 py-0.5 bg-violet-100 dark:bg-violet-950/60 text-violet-600 dark:text-violet-400 rounded-lg text-[10px] font-bold font-mono">
                                                    #{item.id}
                                                </span>
                                                <h3 className="text-base md:text-lg font-bold tracking-tight text-slate-800 dark:text-slate-100">
                                                    {item.word}
                                                </h3>
                                            </div>
                                            <button
                                                onClick={() => playThaiSpeech(item.thai)}
                                                className="w-8 h-8 rounded-lg bg-violet-50 hover:bg-violet-100 dark:bg-slate-700 dark:hover:bg-slate-600 text-violet-500 dark:text-violet-300 flex items-center justify-center transition active:scale-90"
                                                title="單字朗讀"
                                            >
                                                <i data-lucide="volume-2" className="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>

                                        {/* Definition & Category Tag */}
                                        <div className="text-xs md:text-sm font-semibold text-slate-500 dark:text-slate-400 mb-3 pl-1 flex items-center space-x-2">
                                            <span>釋義：<span className="text-slate-800 dark:text-slate-200">{item.meaning}</span></span>
                                            <span className="text-[10px] bg-slate-100 dark:bg-slate-900 text-slate-400 dark:text-slate-500 px-1.5 py-0.2 rounded font-normal shrink-0">
                                                {item.categoryName.split(' ')[0]}
                                            </span>
                                        </div>

                                        {/* Example Sentence Section */}
                                        <div className="bg-slate-50 dark:bg-slate-900/60 rounded-xl p-3 relative overflow-hidden">
                                            <div className="flex justify-between items-start">
                                                <div className="space-y-1 flex-1 pr-2">
                                                    <div className="text-[9px] uppercase tracking-wider font-extrabold text-slate-400">例句羅馬拼音</div>
                                                    <p className="text-xs md:text-sm font-bold text-violet-600 dark:text-violet-400 leading-snug">{item.example}</p>
                                                    <p className="text-[11px] md:text-xs text-slate-600 dark:text-slate-300 font-medium">翻譯：{item.exampleMeaning}</p>
                                                </div>
                                                <button
                                                    onClick={() => playThaiSpeech(item.thaiExample)}
                                                    className="w-7 h-7 rounded-lg bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700/50 text-slate-500 dark:text-slate-400 hover:text-violet-500 flex items-center justify-center transition active:scale-95 shrink-0"
                                                    title="例句朗讀"
                                                >
                                                    <i data-lucide="play" className="w-3 h-3 fill-current"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-12 shadow-xl text-center border border-slate-100 dark:border-slate-700/50 transition-all">
                            <div className="w-16 h-16 mx-auto bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center mb-4">
                                <i data-lucide="search-code" className="w-8 h-8 text-slate-400"></i>
                            </div>
                            <h3 className="text-lg font-bold text-slate-700 dark:text-slate-300">未找到相符字詞</h3>
                            <p className="text-xs text-slate-400 mt-1">請嘗試變更上方分類或輸入其他搜尋關鍵字。</p>
                        </div>
                    )}

                    {/* Pagination */}
                    {totalPages > 1 && (
                        <div className="flex justify-center items-center space-x-2 pt-4">
                            <button
                                onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                                disabled={currentPage === 1}
                                className="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-medium hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-40 transition"
                            >
                                上一頁
                            </button>
                            <span className="text-xs text-slate-500 dark:text-slate-400 font-semibold px-2">
                                {currentPage} / {totalPages}
                            </span>
                            <button
                                onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                                disabled={currentPage === totalPages}
                                className="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-medium hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-40 transition"
                            >
                                下一頁
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
