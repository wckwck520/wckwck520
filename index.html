<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>泰語 500 字學習樂園</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // 核心修正：使用 Google Translate TTS API，保證所有設備都有聲音
        const playThaiSpeech = (text) => {
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=th&client=tw-ob&q=${encodeURIComponent(text)}`;
            const audio = new Audio(url);
            audio.play().catch(e => console.log("播放被瀏覽器阻擋，請點擊畫面再次嘗試"));
        };

        function App() {
            return (
                <div className="p-6 max-w-xl mx-auto">
                    <h1 className="text-2xl font-bold mb-6 text-center">泰語 500 字學習樂園</h1>
                    <div className="space-y-3">
                        {/* 這裡僅放部分測試，您之後可將整個 RAW_VOCAB_DB 放進來 */}
                        <div className="p-4 bg-white shadow rounded-xl border flex justify-between items-center">
                            <div>
                                <p className="font-bold text-lg">kluai</p>
                                <p className="text-sm text-gray-500">กล้วย · 香蕉</p>
                            </div>
                            <button onClick={() => playThaiSpeech("กล้วย")} className="p-3 bg-violet-500 text-white rounded-full">
                                <i data-lucide="volume-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
