        const VOCAB_DATA = RAW_VOCAB_DB.map(r => {
            const catIdx = getCategoryIndex(r[0], r[1], r[3]);
            return {
                id: r[0], word: r[1], thai: r[2], meaning: r[3],
                example: r[4], thaiExample: r[5], exampleMeaning: r[6],
                categoryId: CATEGORIES[catIdx].id,
                categoryName: CATEGORIES[catIdx].name
            };
        });

        // 輔助函式
        function getLevelPool(levelId) {
            if (levelId === 0) return VOCAB_DATA;
            const start = (levelId - 1) * 10;
            return VOCAB_DATA.slice(start, start + 10);
        }

        const getLocalMatches = (sentence) => {
            if (!sentence) return [];
            const normalized = sentence.toLowerCase().replace(/[.,?!]/g, "");
            const matches = [];
            const sortedVocab = [...VOCAB_DATA].sort((a, b) => b.word.length - a.word.length);
            let remaining = normalized;
            for (const item of sortedVocab) {
                const itemWord = item.word.toLowerCase();
                const regex = new RegExp(`\\b${itemWord}\\b|\\b${itemWord}-|-${itemWord}\\b`, 'i');
                if (regex.test(normalized) && remaining.includes(itemWord)) {
                    matches.push(item);
                    remaining = remaining.replace(itemWord, " ".repeat(itemWord.length));
                }
            }
            return matches.sort((a, b) => normalized.indexOf(a.word.toLowerCase()) - normalized.indexOf(b.word.toLowerCase()));
        };

        const renderMarkdown = (text) => {
            if (!text) return null;
            return text.split('\n').map((line, idx) => {
                let cleaned = line.trim();
                if (!cleaned) return <div key={idx} className="h-2"></div>;
                const isBullet = cleaned.startsWith('*') || cleaned.startsWith('-') || /^\d+\./.test(cleaned);
                if (isBullet) cleaned = cleaned.replace(/^[\*\-\d\.]+\s*/, '');
                const parts = cleaned.split('**');
                const renderedParts = parts.map((part, pIdx) => pIdx % 2 === 1 ? <strong key={pIdx} className="text-violet-600 dark:text-violet-400 font-extrabold">{part}</strong> : part);
                return <div key={idx} className={`text-xs md:text-sm leading-relaxed text-slate-700 dark:text-slate-300 py-1 ${isBullet ? 'pl-4 relative before:content-["•"] before:absolute before:left-0 before:text-violet-500 font-medium' : ''}`}>{renderedParts}</div>;
            });
        };

        // 共用 AI 呼叫模組
        function AiBreakdown({ currentWord, playThaiSpeech, nextAction, nextText, isSentenceGame }) {

                    const userQuery = `請為以下句子進行逐字拼音與中文釋義拆解：\n句子拼音：${currentWord.example}\n整句翻譯：${currentWord.exampleMeaning}`;
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    try {
                        const response = await fetch(url, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                        });
                        if (!response.ok) throw new Error('API request failed');
                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) setAiExplanation(text);
                    } catch (error) {
                        setAiError("暫時無法連線獲取 AI 深度解析，請查看本地詞典匹配結果。");
                    } finally {
                        setLoadingAi(false);
                    }
                };
                fetchAi();
            }, [currentWord]);

            return (
                <div className="space-y-4 animate-fade-in mt-4">
                    {/* 如果是重組句子，在頂部顯示全句解釋 */}
                    {isSentenceGame && (
                        <div className="bg-white/60 dark:bg-black/20 rounded-xl p-3 text-left">
                            <p className="text-[10px] uppercase text-slate-500 mb-1">完整句子與解釋</p>
                            <p className="font-thai text-xl text-slate-800 dark:text-slate-100 font-bold mb-1">{currentWord.thaiExample}</p>
                            <p className="text-sm font-bold text-violet-600 dark:text-violet-400 mb-1">{currentWord.example}</p>
                            <p className="text-sm font-medium text-slate-600 dark:text-slate-300">翻譯: {currentWord.exampleMeaning}</p>
                        </div>
                    )}

                    <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-150 dark:border-slate-700/50 shadow-md p-4">
                        <h5 className="text-[10px] uppercase font-extrabold text-slate-400 tracking-wider mb-2 flex items-center"><i className="fa-solid fa-book-open mr-1.5"></i>句子單字匹配對照</h5>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
                            {getLocalMatches(currentWord.example).map((match) => (
                                <div key={match.id} className="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-900/60 rounded-xl border border-slate-100 dark:border-slate-800">
                                    <div>
                                        <div className="flex items-center space-x-1.5">
                                            <span className="text-[9px] bg-slate-200 dark:bg-slate-700 px-1 py-0.5 rounded font-mono">#{match.id}</span>
                                            <span className="font-bold text-slate-800 dark:text-slate-200 text-xs">{match.word}</span>
                                        </div>
                                        <p className="text-[11px] text-slate-500 mt-0.5 font-medium">釋義: {match.meaning}</p>
                                    </div>
                                    <button onClick={() => playThaiSpeech(match.thai)} className="w-7 h-7 flex items-center justify-center rounded bg-white dark:bg-slate-800 text-violet-500 shadow-sm">
                                        <i className="fa-solid fa-volume-high text-xs"></i>
                                    </button>
                                </div>
                            ))}
                        </div>
                        <div className="pt-3 border-t border-slate-100 dark:border-slate-700/80">
                            <div className="flex items-center space-x-1.5 mb-2">
                                <i className="fa-solid fa-bolt text-amber-500 text-xs"></i>
                                <span className="text-[10px] font-extrabold uppercase text-slate-400">AI 導師智能深度剖析</span>
                            </div>
                            {loadingAi ? (
                                <div className="flex items-center space-x-2 text-xs text-slate-400 py-2">
                                    <i className="fa-solid fa-circle-notch fa-spin text-violet-500"></i>
                                    <span>AI 正在全力解析中...</span>
                                </div>
                            ) : aiError ? (
                                <p className="text-xs text-rose-500 font-medium py-1">{aiError}</p>
                            ) : (
                                <div className="bg-slate-50/50 dark:bg-slate-900/40 p-3 rounded-xl border border-slate-100 dark:border-slate-800 max-h-48 overflow-y-auto">
                                    {renderMarkdown(aiExplanation)}
                                </div>
                            )}
                        </div>
                    </div>

                    <button onClick={nextAction} className="w-full bg-slate-800 dark:bg-slate-700 text-white font-bold py-3.5 rounded-xl shadow-md transition flex justify-center items-center active:scale-95">
                        <span>{nextText}</span><i className="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            );
        }

        // ==========================================
        // 🌟 App 主結構
        // ==========================================
        function App() {
            const [theme, setTheme] = useState('light');
            const [activeTab, setActiveTab] = useState('podcast'); // 預設先開啟電台方便展示
            const [audioUnlocked, setAudioUnlocked] = useState(false);
            const [mistakes, setMistakes] = useState([]);
            
            const addMistake = useCallback((id) => setMistakes(prev => Array.from(new Set([...prev, id]))), []);
            const removeMistake = useCallback((id) => setMistakes(prev => prev.filter(x => x !== id)), []);

            const unlockAudio = useCallback(() => {
                if (!audioUnlocked && 'speechSynthesis' in window) {
                    const silentUtterance = new SpeechSynthesisUtterance('');
                    silentUtterance.volume = 0; 
                    window.speechSynthesis.speak(silentUtterance);
                    setAudioUnlocked(true);
                }
            }, [audioUnlocked]);

            useEffect(() => {
                if ('speechSynthesis' in window) {
                    const loadVoices = () => window.speechSynthesis.getVoices();
                    loadVoices();
                    window.speechSynthesis.onvoiceschanged = loadVoices;
                }
            }, []);

            const toggleTheme = () => {
                unlockAudio();
                const nextTheme = theme === 'light' ? 'dark' : 'light';
                setTheme(nextTheme);
                if (nextTheme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            };

            const speakAsync = useCallback((text, lang, rate = 0.82) => {
                return new Promise((resolve) => {
                    if (!('speechSynthesis' in window)) return resolve();
                    window.speechSynthesis.cancel();
                    setTimeout(() => {
                        const utterance = new SpeechSynthesisUtterance(text);
                        window._speechUtteranceRef = utterance;
                        utterance.lang = lang;
                        utterance.rate = rate;
                        if(lang.includes('th')) {
                            const voices = window.speechSynthesis.getVoices();
                            const thaiVoice = voices.find(v => v.lang.toLowerCase().includes('th') || v.name.includes('ไทย') || v.name.toLowerCase().includes('thai'));
                            if (thaiVoice) utterance.voice = thaiVoice;
                        }
                        utterance.onend = () => { window._speechUtteranceRef = null; resolve(); };
                        utterance.onerror = () => { window._speechUtteranceRef = null; resolve(); };
                        window.speechSynthesis.speak(utterance);
                    }, 50);
                });
            }, []);

            const playThaiSpeech = useCallback((thaiText) => {
                unlockAudio();
                speakAsync(thaiText, 'th-TH', 0.82);
            }, [unlockAudio, speakAsync]);

            return (
                <div className="flex flex-col min-h-[100dvh]" onClick={unlockAudio}>
                    <header className="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors">
                        <div className="max-w-6xl mx-auto px-3 py-2 md:py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-2.5">
                                <div className="bg-gradient-to-tr from-violet-500 to-indigo-600 text-white p-2 md:p-2.5 rounded-xl md:rounded-2xl shadow-lg shadow-violet-500/20">
                                    <i className="fa-solid fa-graduation-cap w-5 h-5 md:w-6 md:h-6 text-center text-lg"></i>
                                </div>
                                <div>
                                    <h1 className="text-base md:text-xl font-bold tracking-tight bg-gradient-to-r from-violet-600 to-indigo-600 dark:from-violet-400 dark:to-indigo-400 bg-clip-text text-transparent">
                                        泰語 850 旗艦學習網
                                    </h1>
                                    <p className="text-[10px] md:text-xs text-slate-500 dark:text-slate-400 font-medium">聽力·重組·閃卡·電台·故事·字庫</p>
                                </div>
                            </div>
                            <button onClick={toggleTheme} className="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                                <i className={`fa-solid ${theme === 'light' ? 'fa-moon' : 'fa-sun'} text-sm md:text-base`}></i>
                            </button>
                        </div>

                        <div className="max-w-6xl mx-auto px-2 border-t border-slate-100 dark:border-slate-800/50">
                            <nav className="flex space-x-1 py-1.5 overflow-x-auto scrollbar-none snap-x">
                                <NavButton tab="listening" activeTab={activeTab} setActiveTab={setActiveTab} icon="fa-headphones" label="聽力" />
                                <NavButton tab="sentence" activeTab={activeTab} setActiveTab={setActiveTab} icon="fa-puzzle-piece" label="重組" />
                                <NavButton tab="flashcard" activeTab={activeTab} setActiveTab={setActiveTab} icon="fa-layer-group" label="閃卡" />
                                <NavButton tab="podcast" activeTab={activeTab} setActiveTab={setActiveTab} icon="fa-radio" label="電台" />
                                <NavButton tab="story" activeTab={activeTab} setActiveTab={setActiveTab} icon="fa-book-open" label="故事" />
                                <NavButton tab="library" activeTab={activeTab} setActiveTab={setActiveTab} icon="fa-database" label="字庫" />
                            </nav>
                        </div>
                    </header>

                    <main className="flex-1 max-w-6xl w-full mx-auto p-3 md:p-4 pb-48 mb-32 relative">
                        {activeTab === 'listening' && <ListeningGame playThaiSpeech={playThaiSpeech} addMistake={addMistake} />}
                        {activeTab === 'sentence' && <SentenceGame playThaiSpeech={playThaiSpeech} addMistake={addMistake} />}
                        {activeTab === 'flashcard' && <FlashcardGame playThaiSpeech={playThaiSpeech} mistakes={mistakes} removeMistake={removeMistake} />}
                        {activeTab === 'podcast' && <PodcastMode speakAsync={speakAsync} mistakes={mistakes} />}
                        {activeTab === 'story' && <StoryMode speakAsync={speakAsync} />}
                        {activeTab === 'library' && <VocabularyLibrary playThaiSpeech={playThaiSpeech} />}
                        
                        <div className="h-32 w-full"></div>
                    </main>
                </div>
            );
        }

        function NavButton({ tab, activeTab, setActiveTab, icon, label }) {
            return (
                <button onClick={() => setActiveTab(tab)} className={`flex-1 min-w-[65px] py-2 px-1 rounded-xl font-semibold text-xs transition flex items-center justify-center space-x-1.5 shrink-0 snap-center ${activeTab === tab ? 'bg-violet-500 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                    <i className={`fa-solid ${icon}`}></i><span>{label}</span>
                </button>
            );
        }

        // ==========================================
        // 🎧 1. 聽力選擇 (ListeningGame) 
        // ==========================================
        function ListeningGame({ playThaiSpeech, addMistake }) {
            const [level, setLevel] = useState(0);
            const [gameState, setGameState] = useState('ready'); 
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [options, setOptions] = useState([]);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isCorrect, setIsCorrect] = useState(null);
            const [score, setScore] = useState(0);
            const [questionCount, setQuestionCount] = useState(0);
            const [usedHint, setUsedHint] = useState(false);
            const totalQuestions = 10;
            const totalLevels = Math.ceil(VOCAB_DATA.length / 10);

            const startNewGame = () => { setScore(0); setQuestionCount(0); generateQuestion(); };

            const generateQuestion = () => {
                const pool = getLevelPool(level);
                const correctWord = pool[Math.floor(Math.random() * pool.length)];
                let distractors = [];
                while (distractors.length < 3) {
                    const candidate = VOCAB_DATA[Math.floor(Math.random() * VOCAB_DATA.length)];
                    if (candidate.id !== correctWord.id && !distractors.some(d => d.id === candidate.id)) distractors.push(candidate);
                }
                const shuffledOptions = [correctWord, ...distractors].sort(() => Math.random() - 0.5);

                setCurrentQuestion(correctWord);
                setOptions(shuffledOptions);
                setSelectedAnswer(null);
                setIsCorrect(null);
                setUsedHint(false);
                setGameState('playing');
                setQuestionCount(prev => prev + 1);

                setTimeout(() => playThaiSpeech(correctWord.thaiExample), 300);
            };

            const handleAnswer = (option) => {
                if (selectedAnswer !== null) return;
                setSelectedAnswer(option);
                const correct = option.id === currentQuestion.id;
                setIsCorrect(correct);
                if (correct) setScore(prev => prev + (usedHint ? 0.5 : 1));
                else addMistake(currentQuestion.id);
                setGameState('feedback');
            };

            const handleNext = () => {
                if (questionCount >= totalQuestions) setGameState('finished');
                else generateQuestion();
            };

            return (
                <div className="max-w-2xl mx-auto space-y-4 animate-fade-in">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-700/50 flex justify-between items-center">
                        <span className="text-xs font-bold uppercase text-slate-500"><i className="fa-solid fa-headphones mr-1.5"></i>聽力選擇</span>
                        <select className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold rounded-lg px-2 py-1 outline-none" value={level} onChange={e => { setLevel(Number(e.target.value)); setGameState('ready'); }}>
                            <option value="0">綜合 850 字</option>
                            {[...Array(totalLevels)].map((_, i) => <option key={i+1} value={i+1}>關卡 {i+1} ({i*10+1}-{Math.min((i+1)*10, VOCAB_DATA.length)})</option>)}
                        </select>
                    </div>

                    {gameState === 'ready' && (
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 md:p-8 shadow-xl text-center border border-slate-100 dark:border-slate-700/50">
                            <div className="w-16 h-16 mx-auto bg-emerald-100 dark:bg-emerald-900/40 rounded-full flex items-center justify-center mb-4 text-emerald-500 text-2xl">
                                <i className="fa-solid fa-circle-play"></i>
                            </div>
                            <h2 className="text-xl font-bold mb-2">聽力挑戰測驗</h2>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">聽例句選出正確拼音。答對/答錯皆會自動顯示句子逐字解析！</p>
                            <button onClick={startNewGame} className="w-full bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95">開始測試</button>
                        </div>
                    )}

                    {(gameState === 'playing' || gameState === 'feedback') && currentQuestion && (
                        <div className="space-y-4">
                            <div className="bg-white dark:bg-slate-800 rounded-3xl p-5 shadow-xl text-center relative border border-slate-100 dark:border-slate-700/50 overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>
                                
                                {gameState === 'playing' && (
                                    <button onClick={() => setUsedHint(true)} disabled={usedHint} className={`absolute top-4 right-4 flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold ${usedHint ? 'bg-amber-100 text-amber-600 dark:bg-amber-900/50 dark:text-amber-400' : 'bg-slate-100 text-slate-500 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-400'}`}>
                                        <i className="fa-solid fa-lightbulb"></i><span>{usedHint ? `含 "${currentQuestion.meaning}"` : "提示"}</span>
                                    </button>
                                )}

                                <div className="py-4">
                                    <button onClick={() => playThaiSpeech(currentQuestion.thaiExample)} className="mx-auto w-16 h-16 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-lg active:scale-95 transition text-2xl">
                                        <i className="fa-solid fa-play ml-1"></i>
                                    </button>
                                </div>
                                <div className="text-xs font-bold text-slate-400">進度：{questionCount} / {totalQuestions}</div>
                            </div>

                            <div className="grid grid-cols-1 gap-2.5">
                                {options.map((option, index) => {
                                    let btnStyle = "bg-white dark:bg-slate-800 hover:bg-slate-50 border-slate-100 dark:border-slate-700";
                                    if (gameState === 'feedback') {
                                        if (option.id === currentQuestion.id) btnStyle = "bg-emerald-50 border-2 border-emerald-500 text-emerald-800 dark:bg-emerald-900/20 dark:text-emerald-100";
                                        else if (selectedAnswer && selectedAnswer.id === option.id) btnStyle = "bg-rose-50 border-2 border-rose-500 text-rose-800 dark:bg-rose-900/20 dark:text-rose-100 opacity-80";
                                        else btnStyle = "bg-white border opacity-50 dark:bg-slate-800";
                                    }

                                    return (
                                        <button key={option.id} onClick={() => handleAnswer(option)} disabled={gameState === 'feedback'} className={`p-4 rounded-2xl text-left flex justify-between items-center shadow-sm border ${btnStyle}`}>
                                            <div className="flex items-start space-x-3">
                                                <span className="w-5 h-5 bg-slate-100 dark:bg-slate-700 text-slate-500 rounded text-[10px] font-bold flex items-center justify-center shrink-0">{String.fromCharCode(65 + index)}</span>
                                                <div>
                                                    <span className="text-sm font-bold block dark:text-slate-200">{option.example}</span>
                                                    {/* 中文翻譯選項 */}
                                                    <span className="text-xs text-slate-500 block mt-0.5 font-medium">翻譯: {option.exampleMeaning}</span>
                                                </div>
                                            </div>
                                            {gameState === 'feedback' && option.id === currentQuestion.id && <i className="fa-solid fa-check text-emerald-500"></i>}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* 自動展開的全句與 AI 解析 */}
                            {gameState === 'feedback' && (
                                <div className="animate-fade-in">
                                    <div className={`p-4 rounded-2xl text-center border-2 ${isCorrect ? 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-500 text-emerald-600 dark:text-emerald-400' : 'bg-rose-50 dark:bg-rose-900/20 border-rose-500 text-rose-600 dark:text-rose-400'}`}>
                                        <p className="font-bold flex items-center justify-center text-lg mb-2">
                                            <i className={`fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'} mr-2`}></i>
                                            {isCorrect ? (usedHint ? "答對了！(使用提示 +0.5分)" : "完全正確！(+1分)") : "答錯了！正確句子如下："}
                                        </p>
                                        <div className="bg-white/60 dark:bg-black/20 rounded-xl p-3 text-left mt-2">
                                            <p className="text-[10px] uppercase text-slate-500 mb-1">完整句子與解釋</p>
                                            <p className="font-thai text-xl text-slate-800 dark:text-slate-100 font-bold mb-1">{currentQuestion.thaiExample}</p>
                                            <p className="text-sm font-bold text-violet-600 dark:text-violet-400 mb-1">{currentQuestion.example}</p>
                                            <p className="text-sm font-medium text-slate-600 dark:text-slate-300">翻譯：{currentQuestion.exampleMeaning}</p>
                                        </div>
                                    </div>
                                    <AiBreakdown currentWord={currentQuestion} playThaiSpeech={playThaiSpeech} nextAction={handleNext} nextText={questionCount >= totalQuestions ? "查看結算結果" : "下一題"} isSentenceGame={false} />
                                </div>
                            )}
                        </div>
                    )}

                    {gameState === 'finished' && (
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-xl text-center">
                            <div className="text-5xl mb-4 text-emerald-500"><i className="fa-solid fa-trophy"></i></div>
                            <h2 className="text-2xl font-bold mb-4">挑戰結束！</h2>
                            <p className="text-xl font-extrabold text-emerald-500 mb-6">總分: {score} / {totalQuestions}</p>
                            <button onClick={startNewGame} className="w-full bg-emerald-500 text-white font-bold py-3 rounded-xl transition active:scale-95">重新挑戰</button>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 🧩 2. 句子重組 (Sentence Builder)
        // ==========================================
        function SentenceGame({ playThaiSpeech, addMistake }) {
            const [level, setLevel] = useState(0);
            const [gameState, setGameState] = useState('ready');
            const [currentWord, setCurrentWord] = useState(null);
            const [availableWords, setAvailableWords] = useState([]);
            const [selectedWords, setSelectedWords] = useState([]);
            const [isCorrect, setIsCorrect] = useState(null);
            const [shake, setShake] = useState(false);
            const totalLevels = Math.ceil(VOCAB_DATA.length / 10);

            const startNext = () => {
                const pool = getLevelPool(level);
                const word = pool[Math.floor(Math.random() * pool.length)];
                
                const parts = word.example.split(' ').filter(x => x.trim() !== '');
                const shuffled = [...parts].sort(() => Math.random() - 0.5);
                
                setCurrentWord(word);
                setAvailableWords(shuffled.map((text, i) => ({ id: i, text })));
                setSelectedWords([]);
                setIsCorrect(null);
                setGameState('playing');

                setTimeout(() => playThaiSpeech(word.thaiExample), 300);
            };

            const selectWord = (w) => {
                if (gameState === 'feedback') return;
                setAvailableWords(prev => prev.filter(x => x.id !== w.id));
                setSelectedWords(prev => [...prev, w]);
            };

            const unselectWord = (w) => {
                if (gameState === 'feedback') return;
                setSelectedWords(prev => prev.filter(x => x.id !== w.id));
                setAvailableWords(prev => [...prev, w]);
            };

            const checkAnswer = () => {
                if (availableWords.length > 0) return; 
                const userSentence = selectedWords.map(w => w.text).join(' ');
                const target = currentWord.example.trim();
                
                if (userSentence === target) {
                    setIsCorrect(true);
                    setGameState('feedback');
                } else {
                    setShake(true);
                    setTimeout(() => setShake(false), 500);
                    addMistake(currentWord.id);
                }
            };

            const getWordMeaning = (text) => {
                const cleanText = text.replace(/[.,?!]/g, "").toLowerCase();
                const found = VOCAB_DATA.find(v => v.word.toLowerCase() === cleanText);
                return found ? found.meaning : "";
            };

            return (
                <div className="max-w-xl mx-auto space-y-4 animate-fade-in">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-700/50 flex justify-between items-center">
                        <span className="text-xs font-bold uppercase text-slate-500"><i className="fa-solid fa-puzzle-piece mr-1.5"></i>句子重組</span>
                        <select className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold rounded-lg px-2 py-1 outline-none" value={level} onChange={e => { setLevel(Number(e.target.value)); setGameState('ready'); }}>
                            <option value="0">綜合 850 字</option>
                            {[...Array(totalLevels)].map((_, i) => <option key={i+1} value={i+1}>關卡 {i+1} ({i*10+1}-{Math.min((i+1)*10, VOCAB_DATA.length)})</option>)}
                        </select>
                    </div>

                    {gameState === 'ready' && (
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-xl text-center">
                            <div className="w-16 h-16 mx-auto bg-violet-100 dark:bg-violet-900/40 rounded-full flex items-center justify-center mb-4 text-violet-500 text-2xl">
                                <i className="fa-solid fa-puzzle-piece"></i>
                            </div>
                            <h2 className="text-xl font-bold mb-2">泰語文法重組直覺訓練</h2>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">聽泰語原音、看中文意思，將打散的羅馬拼音方塊依正確的泰語語序排列。</p>
                            <button onClick={startNext} className="w-full bg-violet-500 text-white font-bold py-3.5 rounded-xl shadow-md active:scale-95 transition">開始闖關</button>
                        </div>
                    )}

                    {(gameState === 'playing' || gameState === 'feedback') && currentWord && (
                        <div className="space-y-4">
                            <div className="bg-white dark:bg-slate-800 rounded-3xl p-5 shadow-xl text-center relative border border-slate-100 dark:border-slate-700/50">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-violet-500 to-indigo-600"></div>
                                <button onClick={() => playThaiSpeech(currentWord.thaiExample)} className="mx-auto w-12 h-12 bg-violet-100 dark:bg-violet-900/40 text-violet-600 dark:text-violet-400 rounded-full flex items-center justify-center hover:bg-violet-200 transition mb-3 text-lg">
                                    <i className="fa-solid fa-volume-high"></i>
                                </button>
                                <div className="text-sm font-bold text-slate-700 dark:text-slate-200 mb-1">目標中文：</div>
                                <div className="text-xl font-extrabold text-violet-600 dark:text-violet-400 mb-2">{currentWord.exampleMeaning}</div>
                                <div className="text-xs text-slate-400 font-mono">#{currentWord.id} {currentWord.word} ({currentWord.meaning})</div>
                            </div>

                            <div className={`min-h-[80px] p-4 bg-slate-100 dark:bg-slate-900/50 rounded-2xl border-2 border-dashed ${shake ? 'border-rose-500 animate-pulse' : 'border-slate-300 dark:border-slate-700'} flex flex-wrap content-start gap-2 transition-colors`}>
                                {selectedWords.length === 0 && <span className="text-xs text-slate-400 font-medium m-auto">點擊下方方塊組合句子</span>}
                                {selectedWords.map(w => (
                                    <button key={w.id} onClick={() => unselectWord(w)} disabled={gameState==='feedback'} className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl text-sm font-bold shadow-sm hover:scale-105 transition flex flex-col items-center">
                                        <span>{w.text}</span>
                                    </button>
                                ))}
                            </div>

                            {gameState === 'playing' && (
                                <div className="p-4 flex flex-wrap justify-center gap-2">
                                    {availableWords.map(w => (
                                        <button key={w.id} onClick={() => selectWord(w)} className="bg-violet-100 dark:bg-violet-900/40 text-violet-700 dark:text-violet-300 border border-violet-200 dark:border-violet-700 px-3 py-2 rounded-xl text-sm font-bold shadow-sm hover:scale-105 transition flex flex-col items-center">
                                            <span>{w.text}</span>
                                            {/* 單字中文提示 */}
                                            <span className="text-[9px] font-medium opacity-70 mt-0.5">{getWordMeaning(w.text)}</span>
                                        </button>
                                    ))}
                                </div>
                            )}

                            {gameState === 'playing' && (
                                <button onClick={checkAnswer} disabled={availableWords.length > 0} className="w-full bg-slate-800 dark:bg-slate-700 text-white font-bold py-3.5 rounded-xl disabled:opacity-50 transition active:scale-95">檢查答案</button>
                            )}
                            
                            {/* 重組成功後，自動顯示全句解析區塊 */}
                            {gameState === 'feedback' && (
                                <div className="animate-fade-in">
                                    <div className="bg-emerald-50 dark:bg-emerald-900/20 border-2 border-emerald-500 p-4 rounded-2xl text-center">
                                        <p className="text-emerald-600 dark:text-emerald-400 font-bold flex items-center justify-center text-lg"><i className="fa-solid fa-circle-check mr-2"></i> 語法完全正確！</p>
                                    </div>
                                    <AiBreakdown currentWord={currentWord} playThaiSpeech={playThaiSpeech} nextAction={startNext} nextText="挑戰下一題" isSentenceGame={true} />
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 🎴 3. 閃卡記憶 (Flashcard Game + 錯題本)
        // ==========================================
        function FlashcardGame({ playThaiSpeech, mistakes, removeMistake }) {
            const [mode, setMode] = useState('level'); 
            const [level, setLevel] = useState(1);
            
            const [studyPool, setStudyPool] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [masteryCount, setMasteryCount] = useState(0);
            const totalLevels = Math.ceil(VOCAB_DATA.length / 10);

            useEffect(() => {
                let pool = [];
                if (mode === 'mistakes') {
                    pool = VOCAB_DATA.filter(v => mistakes.includes(v.id)).sort(() => Math.random() - 0.5);
                } else {
                    pool = getLevelPool(level);
                }
                setStudyPool(pool);
                setCurrentIndex(0);
                setMasteryCount(0);
                setIsFlipped(false);
            }, [mode, level, mistakes]);

            const currentCard = studyPool[currentIndex];

            const handleNextCard = (mastered) => {
                setIsFlipped(false);
                if (mastered) {
                    setMasteryCount(prev => prev + 1);
                    if (mode === 'mistakes' && currentCard) removeMistake(currentCard.id); 
                }
                setTimeout(() => {
                    if (currentIndex < studyPool.length - 1) setCurrentIndex(prev => prev + 1);
                    else {
                        if (mode === 'mistakes') setStudyPool(VOCAB_DATA.filter(v => mistakes.includes(v.id)).sort(() => Math.random() - 0.5));
                        setCurrentIndex(0);
                        setMasteryCount(0);
                    }
                }, 300);
            };

            const handleFlip = () => {
                setIsFlipped(!isFlipped);
                if (!isFlipped && currentCard) playThaiSpeech(currentCard.thai);
            };

            return (
                <div className="max-w-md mx-auto space-y-4 animate-fade-in">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-700/50 space-y-3">
                        <div className="flex justify-between items-center">
                            <span className="text-xs font-bold uppercase text-slate-500"><i className="fa-solid fa-layer-group mr-1.5"></i>閃卡模式</span>
                            <div className="flex bg-slate-100 dark:bg-slate-900 rounded-lg p-1 text-[10px] font-bold">
                                <button onClick={() => setMode('level')} className={`px-2 py-1 rounded ${mode === 'level' ? 'bg-white dark:bg-slate-700 text-violet-600 shadow' : 'text-slate-500'}`}>闖關抽卡</button>
                                <button onClick={() => setMode('mistakes')} className={`px-2 py-1 rounded ${mode === 'mistakes' ? 'bg-rose-500 text-white shadow' : 'text-slate-500'}`}>
                                    🔥錯題 ({mistakes.length})
                                </button>
                            </div>
                        </div>
                        {mode === 'level' && (
                            <select className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold rounded-lg px-2 py-2 outline-none" value={level} onChange={e => setLevel(Number(e.target.value))}>
                                <option value="0">綜合 850 字</option>
                                {[...Array(totalLevels)].map((_, i) => <option key={i+1} value={i+1}>關卡 {i+1} ({i*10+1}-{Math.min((i+1)*10, VOCAB_DATA.length)})</option>)}
                            </select>
                        )}
                    </div>

                    {!currentCard ? (
                        <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl text-center border border-slate-100 dark:border-slate-700/50">
                            <i className="fa-solid fa-circle-check text-5xl text-emerald-400 mb-4"></i>
                            <h3 className="font-bold text-slate-700 dark:text-slate-300">目前沒有需要特訓的錯題！</h3>
                            <p className="text-xs text-slate-400 mt-2">請先前往聽力或重組測驗挑戰。</p>
                        </div>
                    ) : (
                        <>
                            <div className="text-center text-xs font-bold text-slate-400">進度: {currentIndex + 1} / {studyPool.length} (本輪掌握 {masteryCount})</div>
                            <div onClick={handleFlip} className="w-full h-[320px] perspective-1000 cursor-pointer">
                                <div className={`w-full h-full duration-500 transform-style-3d relative ${isFlipped ? 'rotate-y-180' : ''}`}>
                                    {/* FRONT */}
                                    <div className="absolute w-full h-full backface-hidden bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-xl flex flex-col items-center justify-center p-6">
                                        <div className="absolute top-4 left-4 text-[10px] font-mono font-bold text-slate-400">#{currentCard.id}</div>
                                        <div className="absolute top-4 right-4 text-[10px] bg-slate-100 dark:bg-slate-900 px-2 py-0.5 rounded text-slate-500">{currentCard.categoryName.split(' ')[0]}</div>
                                        <h2 className="text-4xl font-extrabold text-slate-800 dark:text-white mb-2">{currentCard.meaning}</h2>
                                        <p className="text-xs text-violet-500 font-bold animate-pulse mt-4 flex items-center"><i className="fa-solid fa-hand-pointer mr-2"></i> 點擊翻轉</p>
                                    </div>
                                    {/* BACK */}
                                    <div className="absolute w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-violet-500 to-indigo-600 rounded-3xl shadow-xl p-6 text-center text-white flex flex-col justify-center">
                                        <div className="absolute top-4 left-4 text-[10px] font-mono opacity-80">#{currentCard.id}</div>
                                        <h3 className="text-4xl font-extrabold tracking-tight mb-2">{currentCard.word}</h3>
                                        <p className="text-base font-medium opacity-90 mb-6">{currentCard.meaning}</p>
                                        <div className="bg-white/10 rounded-xl p-3 text-left">
                                            <p className="text-[9px] uppercase font-bold text-violet-200 mb-1">應用例句</p>
                                            <p className="text-sm font-bold">{currentCard.example}</p>
                                            <p className="text-xs opacity-80 mt-1">{currentCard.exampleMeaning}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className={`grid grid-cols-2 gap-4 transition-opacity duration-300 ${isFlipped ? 'opacity-100' : 'opacity-40 pointer-events-none'}`}>
                                <button onClick={(e) => { e.stopPropagation(); handleNextCard(false); }} className="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold py-3.5 rounded-2xl active:scale-95 transition text-sm">
                                    ❌ 再複習
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); handleNextCard(true); }} className="bg-emerald-500 text-white font-bold py-3.5 rounded-2xl active:scale-95 transition text-sm">
                                    ✅ 記住了
                                </button>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        // ==========================================
        // 🎧 4. 沉浸式電台 (Podcast Mode) - 全新升級版
        // ==========================================
        function PodcastMode({ speakAsync, mistakes }) {
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentIndex, setCurrentIndex] = useState(0);
            
            // 播放設定狀態
            const [channel, setChannel] = useState('all');
            const [playbackMode, setPlaybackMode] = useState('default'); // default, shadow, thai_only, loop
            const [speed, setSpeed] = useState(0.8);
            const [bgm, setBgm] = useState('none'); // none, rain, cafe
            const [sleepTimer, setSleepTimer] = useState(0); // 0 (off), 15, 30, 60
            const [isShuffle, setIsShuffle] = useState(false);
            const [showSettings, setShowSettings] = useState(false); // 控制設定面板展開

            const stopFlag = useRef(false);
            const bgmAudioRef = useRef(null);

            // BGM 音源 (使用 Google 提供的免費穩定音源)
            const BGM_URLS = {
                rain: 'https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg',
                cafe: 'https://actions.google.com/sounds/v1/crowds/restaurant_ambience.ogg'
            };

            // 輔助函式：延遲 (用於製造語音空隙)
            const delay = ms => new Promise(r => setTimeout(r, ms));

            // 動態產生播放清單
            const playlist = useMemo(() => {
                let list = [];
                if (channel === 'all') {
                    list = [...VOCAB_DATA];
                } else if (channel === 'mistakes') {
                    list = VOCAB_DATA.filter(v => mistakes.includes(v.id));
                } else {
                    list = VOCAB_DATA.filter(v => v.categoryId === channel);
                }
                
                if (list.length === 0) list = [VOCAB_DATA[0]]; // 防呆

                if (isShuffle) {
                    list = list.sort(() => Math.random() - 0.5);
                }
                return list;
            }, [channel, isShuffle, mistakes]);

            // 頻道變更時，重置進度
            useEffect(() => { setCurrentIndex(0); }, [playlist]);

            // 更新手機鎖定畫面的 MediaSession (如果瀏覽器支援)
            const updateMediaSession = useCallback((item) => {
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: `${item.word} (${item.meaning})`,
                        artist: '泰語 850 潛意識電台',
                        album: item.example
                    });
                }
            }, []);

            // 核心播放循環
            const startPodcast = async () => {
                if (isPlaying) { 
                    stopFlag.current = true; 
                    setIsPlaying(false); 
                    window.speechSynthesis.cancel(); 
                    return; 
                }
                
                stopFlag.current = false; 
                setIsPlaying(true);

                // 設定 MediaSession 控制按鈕
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.setActionHandler('pause', () => { stopFlag.current = true; setIsPlaying(false); window.speechSynthesis.cancel(); });
                    navigator.mediaSession.setActionHandler('play', startPodcast);
                    navigator.mediaSession.setActionHandler('nexttrack', () => { window.speechSynthesis.cancel(); setCurrentIndex(p => Math.min(playlist.length - 1, p + 1)); });
                    navigator.mediaSession.setActionHandler('previoustrack', () => { window.speechSynthesis.cancel(); setCurrentIndex(p => Math.max(0, p - 1)); });
                }

                for (let i = currentIndex; i < playlist.length; i++) {
                    if (stopFlag.current) break;
                    setCurrentIndex(i);
                    const item = playlist[i];
                    updateMediaSession(item);

                    try {
                        // 依照不同模式決定播放邏輯
                        if (playbackMode === 'thai_only') {
                            // 純泰語盲聽：泰語 -> 例句
                            await speakAsync(item.thai, 'th-TH', speed);
                            if (stopFlag.current) break; await delay(800);
                            await speakAsync(item.thaiExample, 'th-TH', speed);
                            if (stopFlag.current) break; await delay(2000);
                        } 
                        else if (playbackMode === 'shadow') {
                            // 跟讀留白：泰語 -> 等待 -> 中文 -> 例句 -> 等待
                            await speakAsync(item.thai, 'th-TH', speed);
                            if (stopFlag.current) break; await delay(2500); // 留白 2.5 秒跟讀
                            await speakAsync(item.meaning, 'zh-TW', 1.0);
                            if (stopFlag.current) break; await delay(800);
                            await speakAsync(item.thaiExample, 'th-TH', speed);
                            if (stopFlag.current) break; await delay(3000); // 例句留白 3 秒跟讀
                        }
                        else if (playbackMode === 'loop') {
                            // 洗腦循環：單字+例句 重複播 3 次
                            for(let j=0; j<3; j++) {
                                if (stopFlag.current) break;
                                await speakAsync(item.thai, 'th-TH', speed);
                                if (stopFlag.current) break; await delay(500);
                                await speakAsync(item.thaiExample, 'th-TH', speed);
                                if (stopFlag.current) break; await delay(1000);
                            }
                        }
                        else {
                            // 預設模式：單字 -> 中文 -> 例句
                            await speakAsync(item.thai, 'th-TH', speed);
                            if (stopFlag.current) break; await delay(500);
                            await speakAsync(item.meaning, 'zh-TW', 1.0);
                            if (stopFlag.current) break; await delay(500);
                            await speakAsync(item.thaiExample, 'th-TH', speed);
                            if (stopFlag.current) break; await delay(1500);
                        }
                    } catch (e) { console.error("Speech Error:", e); }
                }
                
                if(!stopFlag.current) setIsPlaying(false); // 播完自動停止
            };

            // 控制 BGM 播放
            useEffect(() => {
                if (bgm !== 'none' && isPlaying) {
                    if (bgmAudioRef.current) {
                        bgmAudioRef.current.volume = 0.3; // BGM 調小聲作為背景音
                        bgmAudioRef.current.play().catch(e => console.log("BGM play failed:", e));
                    }
                } else {
                    if (bgmAudioRef.current) bgmAudioRef.current.pause();
                }
            }, [bgm, isPlaying]);

            // 睡眠定時器邏輯
            useEffect(() => {
                let t;
                if (isPlaying && sleepTimer > 0) {
                    t = setTimeout(() => {
                        stopFlag.current = true;
                        setIsPlaying(false);
                        window.speechSynthesis.cancel();
                    }, sleepTimer * 60 * 1000);
                }
                return () => clearTimeout(t);
            }, [isPlaying, sleepTimer]);

            // 組件卸載清理
            useEffect(() => { 
                return () => { 
                    stopFlag.current = true; 
                    window.speechSynthesis.cancel(); 
                    if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
                }; 
            }, []);

            return (
                <div className="max-w-md mx-auto space-y-4 animate-fade-in mt-2 relative">
                    
                    {/* BGM 音訊元素 (隱藏) */}
                    <audio ref={bgmAudioRef} src={bgm !== 'none' ? BGM_URLS[bgm] : ''} loop />

                    {/* 電台主播放器介面 */}
                    <div className="bg-slate-900 text-white p-6 md:p-8 rounded-[32px] shadow-2xl relative overflow-hidden transition-all duration-500">
                        {/* 氛圍背景裝飾 */}
                        <div className="absolute top-0 right-0 p-4 opacity-[0.03] pointer-events-none"><i className="fa-solid fa-radio text-9xl"></i></div>
                        
                        <div className="flex justify-between items-start z-10 relative mb-6">
                            <div>
                                <h2 className="text-xl md:text-2xl font-bold mb-1 tracking-wide text-violet-100">潛意識泰語電台</h2>
                                <p className="text-slate-400 text-[10px] md:text-xs">鎖屏聽，讓泰語成為你的背景音。</p>
                            </div>
                            <button onClick={() => setShowSettings(!showSettings)} className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors ${showSettings ? 'bg-violet-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                                <i className="fa-solid fa-sliders"></i>
                            </button>
                        </div>

                        {/* 設定控制面板 (展開/收合) */}
                        <div className={`overflow-hidden transition-all duration-300 ease-in-out z-10 relative ${showSettings ? 'max-h-[500px] mb-8 opacity-100' : 'max-h-0 opacity-0'}`}>
                            <div className="bg-slate-800/80 rounded-2xl p-4 space-y-4 border border-slate-700/50 backdrop-blur-sm">
                                {/* 頻道選擇 */}
                                <div>
                                    <label className="text-[10px] text-slate-400 uppercase font-bold mb-1.5 block">播放頻道 (Playlist)</label>
                                    <select value={channel} onChange={e => setChannel(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-xs font-bold rounded-xl px-3 py-2 outline-none text-violet-100">
                                        <option value="all">📻 全部單字 (850字)</option>
                                        <option value="mistakes">🔥 錯題本特訓 ({mistakes.length}字)</option>
                                        <optgroup label="情境分類">
                                            {CATEGORIES.filter(c => c.id !== 'all').map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </optgroup>
                                    </select>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-3">
                                    {/* 播放模式 */}
                                    <div>
                                        <label className="text-[10px] text-slate-400 uppercase font-bold mb-1.5 block">模式 (Mode)</label>
                                        <select value={playbackMode} onChange={e => setPlaybackMode(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-xs font-bold rounded-xl px-2 py-2 outline-none text-white">
                                            <option value="default">預設 (泰中泰)</option>
                                            <option value="shadow">跟讀留白 (Shadowing)</option>
                                            <option value="thai_only">純泰語盲聽</option>
                                            <option value="loop">洗腦循環 (x3)</option>
                                        </select>
                                    </div>
                                    {/* 語速 */}
                                    <div>
                                        <label className="text-[10px] text-slate-400 uppercase font-bold mb-1.5 block">語速 (Speed)</label>
                                        <select value={speed} onChange={e => setSpeed(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-700 text-xs font-bold rounded-xl px-2 py-2 outline-none text-white">
                                            <option value={1.0}>1.0x (母語語速)</option>
                                            <option value={0.8}>0.8x (標準)</option>
                                            <option value={0.5}>0.5x (慢速解析)</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    {/* 白噪音 */}
                                    <div>
                                        <label className="text-[10px] text-slate-400 uppercase font-bold mb-1.5 block">陪伴白噪音 (BGM)</label>
                                        <select value={bgm} onChange={e => setBgm(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-[11px] font-bold rounded-xl px-2 py-2 outline-none text-amber-200">
                                            <option value="none">🔇 無</option>
                                            <option value="rain">🌧️ 下雨聲 (Rain)</option>
                                            <option value="cafe">☕ 咖啡廳 (Cafe)</option>
                                        </select>
                                    </div>
                                    {/* 睡眠定時 */}
                                    <div>
                                        <label className="text-[10px] text-slate-400 uppercase font-bold mb-1.5 block">睡眠定時 (Timer)</label>
                                        <select value={sleepTimer} onChange={e => setSleepTimer(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-700 text-[11px] font-bold rounded-xl px-2 py-2 outline-none text-indigo-200">
                                            <option value={0}>🚫 關閉</option>
                                            <option value={15}>⏱️ 15 分鐘</option>
                                            <option value={30}>⏱️ 30 分鐘</option>
                                            <option value={60}>⏱️ 60 分鐘</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 黑膠唱片動畫區 */}
                        <div className={`mb-8 relative z-10 transition-transform duration-500 ${showSettings ? 'scale-75 -my-4' : 'scale-100 mt-6'}`}>
                            <div className={`w-36 h-36 md:w-44 md:h-44 mx-auto rounded-full vinyl-record flex items-center justify-center bg-slate-800 ${isPlaying ? 'animate-spin-slow' : ''}`}>
                                {/* 唱片中心標籤 */}

        function StoryMode({ speakAsync }) {
            const [selectedStory, setSelectedStory] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [activeLine, setActiveLine] = useState(-1);
            const stopFlag = useRef(false);
            const story = STORIES[selectedStory];

            const playStory = async () => {
                if (isPlaying) { stopFlag.current = true; setIsPlaying(false); window.speechSynthesis.cancel(); return; }
                stopFlag.current = false; setIsPlaying(true);
                for (let i = 0; i < story.lines.length; i++) {
                    if (stopFlag.current) break;
                    setActiveLine(i);
                    await speakAsync(story.lines[i].thai, 'th-TH', 0.8);
                    await new Promise(r => setTimeout(r, 600));
                }
                setIsPlaying(false); setActiveLine(-1);
            };

            useEffect(() => { return () => { stopFlag.current = true; window.speechSynthesis.cancel(); }; }, []);

            return (
                <div className="max-w-2xl mx-auto space-y-4 animate-fade-in">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-700/50 flex justify-between items-center">
                        <span className="text-xs font-bold uppercase text-slate-500"><i className="fa-solid fa-book-open mr-1.5"></i>情境短文 (共30章)</span>
                        <select className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold rounded-lg px-2 py-1 outline-none max-w-[200px] truncate" value={selectedStory} onChange={e => setSelectedStory(Number(e.target.value))}>
                            {STORIES.map((s, i) => <option key={i} value={i}>{s.title}</option>)}
                        </select>
                    </div>

                    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 md:p-8 shadow-xl border border-slate-100 dark:border-slate-700/50 relative">
                        <button onClick={playStory} className="absolute top-6 right-6 w-12 h-12 bg-violet-50 hover:bg-violet-600 text-white rounded-full flex items-center justify-center shadow-md transition active:scale-95 z-10 text-xl">
                            <i className={`fa-solid ${isPlaying ? 'fa-square' : 'fa-play ml-1'}`}></i>
                        </button>
                        
                        <h2 className="text-2xl font-bold mb-6 text-violet-600 dark:text-violet-400 border-b border-slate-100 dark:border-slate-700 pb-4 pr-14">{story.title}</h2>
                        
                        <div className="space-y-5 relative">
                            {story.lines.map((line, idx) => {
                                const isActive = activeLine === idx;
                                return (
                                    <div key={idx} className={`p-4 rounded-2xl transition-all duration-300 ${isActive ? 'bg-violet-50 dark:bg-violet-900/30 border border-violet-200 dark:border-violet-700 shadow-sm scale-[1.02]' : 'bg-transparent'}`}>
                                        <p className={`font-thai text-xl mb-1 font-bold ${isActive ? 'text-violet-700 dark:text-violet-300' : 'text-slate-400'}`}>{line.thai}</p>
                                        <p className={`font-bold text-lg mb-1 transition-colors ${isActive ? 'text-violet-600 dark:text-violet-400' : 'text-slate-700 dark:text-slate-300'}`}>{line.pinyin}</p>
                                        <p className="text-sm font-medium text-slate-500 dark:text-slate-400">翻譯: {line.meaning}</p>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function VocabularyLibrary({ playThaiSpeech }) {
            const [selectedCatId, setSelectedCatId] = useState("all");
            const [searchQuery, setSearchQuery] = useState("");
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 12;

            const categoryCounts = useMemo(() => {
                const counts = { all: VOCAB_DATA.length };
                CATEGORIES.forEach(c => {
                    if (c.id !== "all") counts[c.id] = VOCAB_DATA.filter(item => item.categoryId === c.id).length;
                });
                return counts;
            }, []);

            const filteredVocab = useMemo(() => {
                let list = VOCAB_DATA;
                if (selectedCatId !== "all") list = list.filter(item => item.categoryId === selectedCatId);
                const query = searchQuery.trim().toLowerCase();
                if (query) {
                    list = list.filter(item => item.word.toLowerCase().includes(query) || item.meaning.toLowerCase().includes(query) || item.id.toString() === query);
                }
                return list;
            }, [selectedCatId, searchQuery]);

            const totalPages = Math.ceil(filteredVocab.length / itemsPerPage);
            const paginatedVocab = useMemo(() => filteredVocab.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage), [filteredVocab, currentPage]);

            useEffect(() => setCurrentPage(1), [selectedCatId, searchQuery]);

            return (
                <div className="space-y-4 animate-fade-in">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl border border-slate-100 dark:border-slate-700/50 transition-all flex flex-col md:flex-row md:items-center justify-between gap-3">
                        <div>
                            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">羅馬拼音總字庫</span>
                            <h2 className="text-base md:text-xl font-bold">情境分類單字庫 ({filteredVocab.length} 字)</h2>
                        </div>
                        <div className="relative flex-1 md:max-w-md">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i className="fa-solid fa-magnifying-glass"></i>
                            </div>
                            <input type="text" placeholder="搜尋拼音、含義หรือ編號 (例: 850)..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-violet-500 text-xs md:text-sm transition" />
                        </div>
                    </div>

                    <div className="overflow-x-auto pb-2 flex space-x-2 scrollbar-none snap-x">
                        {CATEGORIES.map((cat) => (
                            <button key={cat.id} onClick={() => setSelectedCatId(cat.id)} className={`px-3 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shrink-0 border snap-center ${selectedCatId === cat.id ? 'bg-violet-600 text-white border-violet-600' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700'}`}>
                                <i className={`fa-solid ${cat.icon}`}></i><span>{cat.name.split(' ')[1] || cat.name}</span><span className={`text-[9px] px-1.5 py-0.5 rounded-full ${selectedCatId === cat.id ? 'bg-white/20' : 'bg-slate-100 dark:bg-slate-900'}`}>{categoryCounts[cat.id]}</span>
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {paginatedVocab.map((item) => (
                            <div key={item.id} className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-700">
                                <div className="flex justify-between items-start mb-2">
                                    <div className="flex items-center space-x-2">
                                        <span className="px-2 py-0.5 bg-violet-100 text-violet-600 dark:bg-violet-900/40 dark:text-violet-400 rounded text-[10px] font-bold font-mono">#{item.id}</span>
                                        <h3 className="text-base font-bold dark:text-white">{item.word}</h3>
                                    </div>
                                    <button onClick={() => playThaiSpeech(item.thai)} className="w-7 h-7 bg-violet-50 text-violet-500 dark:bg-slate-700 dark:text-violet-400 rounded-lg flex justify-center items-center transition active:scale-90">
                                        <i className="fa-solid fa-volume-high text-xs"></i>
                                    </button>
                                </div>
                                <div className="text-xs text-slate-500 mb-2 font-medium pl-1">釋義：<span className="text-slate-800 dark:text-slate-200">{item.meaning}</span></div>
                                <div className="bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl">
                                    <p className="text-[10px] text-violet-400 font-bold mb-0.5">例句</p>
                                    <p className="font-thai text-lg font-bold text-slate-800 dark:text-slate-100 mb-1">{item.thaiExample}</p>
                                    <p className="text-sm font-bold text-violet-600 dark:text-violet-400 mb-1">{item.example}</p>
                                    <p className="text-[11px] text-slate-500">翻譯: {item.exampleMeaning}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    {totalPages > 1 && (
                        <div className="flex justify-center items-center space-x-2 pt-2">
                            <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="px-3 py-1 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-lg text-xs font-bold disabled:opacity-40">上一頁</button>
                            <span className="text-xs text-slate-500 font-bold px-2">{currentPage} / {totalPages}</span>
                            <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages} className="px-3 py-1 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-lg text-xs font-bold disabled:opacity-40">下一頁</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
